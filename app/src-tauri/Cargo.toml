[package]
name = "discord-alt"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
